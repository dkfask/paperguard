# PaperGuard 生产环境 nginx 站点配置（权威副本）
#
# 这份文件是生产实际的站点配置。生产 nginx 不读仓库文件，历史上是临时 SSH
# 改的，导致配置不可复现、不可审计。此处入库作为唯一事实来源，改动后必须
# 同步到服务器：
#
#   sudo cp ops/nginx/paperguard.site.conf /etc/nginx/sites-available/paperguard
#   sudo ln -sfn /etc/nginx/sites-available/paperguard /etc/nginx/sites-enabled/paperguard
#   sudo nginx -t && sudo systemctl reload nginx
#
# 部署目录：/var/www/paperguard（由 releases/<sha>/ 原子换名切换）

server {
    # 生产走 8080。同机 80/443 端口由 api/paper/schedule.thunderuni.com 等站点占用。
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/paperguard;
    index index.html;
    client_max_body_size 50m;

    # 静态资源缓存
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 品牌素材
    location ~* ^/(icon-shield|favicon-192|favicon-64|wordmark|logo|avatar)\.(png|jpe?g|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 静态资源缺件必须返回 404。
    # 此前只靠 `location /` 的 try_files 兜底，/favicon.ico 这类缺失文件会拿到
    # 200 text/html（内容是 SPA 首页），浏览器把 HTML 当图片/脚本解析，且
    # 服务端无法从状态码发现缺件。
    location ~* \.(css|js|mjs|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot|otf|txt|xml|webmanifest)$ {
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 私有图片由后端鉴权, 禁止公共缓存
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
