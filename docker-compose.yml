services:
  backend:
    build:
      context: ./backend
    environment:
      - UVICORN_HOST=0.0.0.0
      - PAPERGUARD_ADMIN_PASSWORD=${PAPERGUARD_ADMIN_PASSWORD:?请设置管理员密码}
      - PAPERGUARD_CORS_ORIGINS=${PAPERGUARD_CORS_ORIGINS:-http://localhost:8080}
      - PAPERGUARD_WECHAT_APP_ID=${PAPERGUARD_WECHAT_APP_ID:-}
      - PAPERGUARD_WECHAT_APP_SECRET=${PAPERGUARD_WECHAT_APP_SECRET:-}
      - PAPERGUARD_MP_BINDING_SECRET=${PAPERGUARD_MP_BINDING_SECRET:-}
      - PAPERGUARD_WECHAT_SUBSCRIBE_TEMPLATES=${PAPERGUARD_WECHAT_SUBSCRIBE_TEMPLATES:-}
      - PAPERGUARD_DATA_DIR=/app/data
      - PAPERGUARD_DB_PATH=/app/data/paperguard.db
    env_file:
      - path: .env
        required: false
    volumes:
      # 数据持久化: 论文项目(SQLite) + 上传图片
      - paperguard_data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      - PAPERGUARD_WORKER_INTERVAL_SECONDS=${PAPERGUARD_WORKER_INTERVAL_SECONDS:-30}
      - PAPERGUARD_WECHAT_APP_ID=${PAPERGUARD_WECHAT_APP_ID:-}
      - PAPERGUARD_WECHAT_APP_SECRET=${PAPERGUARD_WECHAT_APP_SECRET:-}
      - PAPERGUARD_MP_BINDING_SECRET=${PAPERGUARD_MP_BINDING_SECRET:-}
      - PAPERGUARD_WECHAT_SUBSCRIBE_TEMPLATES=${PAPERGUARD_WECHAT_SUBSCRIBE_TEMPLATES:-}
      - PAPERGUARD_DATA_DIR=/app/data
      - PAPERGUARD_DB_PATH=/app/data/paperguard.db
    volumes:
      - paperguard_data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  paperguard_data:
