id: GB-T-7714-1-2015
name: "GB/T 7714.1—2015 信息与文献 参考文献著录规则"
version: 1.0.0
rules:
  # ===== 参考文献结构化格式检查（10 核心规则）=====

  - id: PG-REF-FONT-SIZE
    severity: warning
    scope: "paragraphs[?style_id == 'Bibliography' || style_id == 'References' || style_id == '参考文献']"
    when:
      "!=":
        - var: "runs.0.font_size_pt"
        - 10.5
    message: "参考文献条目字号应为 10.5pt（小五）"
    fix:
      action: set
      target: "run.font_size_pt"
      value: 10.5

  - id: PG-REF-FONT-EASTASIA
    severity: warning
    scope: "paragraphs[?style_id == 'Bibliography' || style_id == 'References' || style_id == '参考文献']"
    when:
      "!=":
        - var: "runs.0.font_eastasia"
        - "宋体"
    message: '参考文献中文字体应为"宋体"'
    fix:
      action: set
      target: "run.font_eastasia"
      value: "宋体"

  - id: PG-REF-FONT-ASCII
    severity: info
    scope: "paragraphs[?style_id == 'Bibliography' || style_id == 'References' || style_id == '参考文献']"
    when:
      "!=":
        - var: "runs.0.font_ascii"
        - "Times New Roman"
    message: '参考文献英文字体应为"Times New Roman"'
    fix:
      action: set
      target: "run.font_ascii"
      value: "Times New Roman"

  - id: PG-REF-LINE-SPACING
    severity: warning
    scope: "paragraphs[?style_id == 'Bibliography' || style_id == 'References' || style_id == '参考文献']"
    when:
      "!=":
        - var: "line_spacing"
        - 1.5
    message: "参考文献行距应为 1.5 倍"
    fix:
      action: set
      target: "paragraph.line_spacing"
      value: 1.5

  - id: PG-REF-FIRST-LINE-INDENT
    severity: warning
    scope: "paragraphs[?style_id == 'Bibliography' || style_id == 'References' || style_id == '参考文献']"
    when:
      "!=":
        - var: "first_line_indent_cm"
        - 0.0
    message: "参考文献条目无首行缩进（悬挂缩进在序号处）"
    fix:
      action: set
      target: "paragraph.first_line_indent_cm"
      value: 0.0

  - id: PG-REF-ALIGN
    severity: info
    scope: "paragraphs[?style_id == 'Bibliography' || style_id == 'References' || style_id == '参考文献']"
    when:
      "!=":
        - var: "align"
        - "left"
    message: "参考文献应对齐（左对齐）"
    fix:
      action: set
      target: "paragraph.alignment"
      value: "left"

  - id: PG-REF-SPACE-BEFORE
    severity: warning
    scope: "paragraphs[?style_id == 'Bibliography' || style_id == 'References' || style_id == '参考文献']"
    when:
      "!=":
        - var: "space_before_pt"
        - 0.0
    message: "参考文献段前应为 0pt"
    fix:
      action: set
      target: "paragraph.space_before_pt"
      value: 0.0

  - id: PG-REF-SPACE-AFTER
    severity: warning
    scope: "paragraphs[?style_id == 'Bibliography' || style_id == 'References' || style_id == '参考文献']"
    when:
      "!=":
        - var: "space_after_pt"
        - 0.0
    message: "参考文献段后应为 0pt"
    fix:
      action: set
      target: "paragraph.space_after_pt"
      value: 0.0

  - id: PG-REF-NO-UNDERLINE
    severity: warning
    scope: "paragraphs[?style_id == 'Bibliography' || style_id == 'References' || style_id == '参考文献']"
    when:
      "!=":
        - var: "runs.0.underline"
        - null
    message: "参考文献不应使用下划线"
    fix:
      action: set
      target: "run.underline"
      value: null

  - id: PG-REF-NO-BOLD
    severity: info
    scope: "paragraphs[?style_id == 'Bibliography' || style_id == 'References' || style_id == '参考文献']"
    when:
      "==":
        - var: "runs.0.bold"
        - true
    message: "参考文献条目不应整段加粗"
    fix:
      action: set
      target: "run.bold"
      value: false
