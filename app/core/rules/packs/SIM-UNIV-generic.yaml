id: SIM-UNIV-generic
name: "通用高校论文样式（自制模拟）"
version: 1.0.0
rules:
  # ===== 封面 (4 条) =====

  - id: PG-COVER-TITLE-CENTER
    severity: info
    scope: "paragraphs[?style_id == 'CoverTitle' || style_id == 'Cover' || style_id == '论文标题']"
    when:
      "!=":
        - var: "alignment"
        - "center"
    message: "论文封面标题应居中"
    fix:
      action: set
      target: "paragraph.alignment"
      value: "center"

  - id: PG-COVER-TITLE-FONT-SIZE
    severity: warning
    scope: "paragraphs[?style_id == 'CoverTitle' || style_id == 'Cover' || style_id == '论文标题']"
    when:
      or:
        - "!=":
            - var: "runs.0.font_size_pt"
            - 22.0
        - "!=":
            - var: "runs.0.font_size_pt"
            - 18.0
    message: "论文封面标题字号应为 22pt（二号）或 18pt"
    fix:
      action: set
      target: "run.font_size_pt"
      value: 22.0

  - id: PG-COVER-UNIV-NAME-FONT
    severity: info
    scope: "paragraphs[?style_id == 'CoverUnivName' || style_id == '学校名称']"
    when:
      "!=":
        - var: "runs.0.font_eastasia"
        - "黑体"
    message: '学校名称应为黑体'
    fix:
      action: set
      target: "run.font_eastasia"
      value: "黑体"

  - id: PG-COVER-DATE-FONT-SIZE
    severity: info
    scope: "paragraphs[?style_id == 'CoverDate' || style_id == '日期']"
    when:
      "!=":
        - var: "runs.0.font_size_pt"
        - 16.0
    message: "封面日期字号应为 16pt"
    fix:
      action: set
      target: "run.font_size_pt"
      value: 16.0

  # ===== 摘要 (4 条) =====

  - id: PG-ABSTRACT-HEADER-FONT
    severity: warning
    scope: "paragraphs[?style_id == 'AbstractHeader' || style_id == 'Abstract' || style_id == '摘要']"
    when:
      "!=":
        - var: "runs.0.font_eastasia"
        - "黑体"
    message: '摘要标题应为黑体'
    fix:
      action: set
      target: "run.font_eastasia"
      value: "黑体"

  - id: PG-ABSTRACT-BODY-FONT
    severity: info
    scope: "paragraphs[?style_id == 'AbstractBody' || style_id == 'AbstractContent']"
    when:
      "!=":
        - var: "runs.0.font_eastasia"
        - "宋体"
    message: '摘要正文应为宋体'
    fix:
      action: set
      target: "run.font_eastasia"
      value: "宋体"

  - id: PG-ABSTRACT-INDENT
    severity: info
    scope: "paragraphs[?style_id == 'AbstractBody' || style_id == 'AbstractContent']"
    when:
      "!=":
        - var: "first_line_indent_cm"
        - 0.74
    message: "摘要正文应首行缩进 2 字符（0.74cm）"
    fix:
      action: set
      target: "paragraph.first_line_indent_cm"
      value: 0.74

  - id: PG-ABSTRACT-KEYWORD-FONT-SIZE
    severity: info
    scope: "paragraphs[?style_id == 'Keywords' || style_id == '关键词']"
    when:
      "!=":
        - var: "runs.0.font_size_pt"
        - 10.5
    message: "关键词字号应为 10.5pt（小五）"
    fix:
      action: set
      target: "run.font_size_pt"
      value: 10.5

  # ===== 正文 (6 条 — 与 GB-T-7713 等价但独立维护) =====

  - id: PG-BODY-LINE-SPACING
    severity: warning
    scope: "paragraphs[?style_id == 'BodyText' || style_id == 'Body' || style_id == 'Normal']"
    when:
      "!=":
        - var: "line_spacing"
        - 1.5
    message: "正文字距应为 1.5 倍"
    fix:
      action: set
      target: "paragraph.line_spacing"
      value: 1.5

  - id: PG-BODY-FONT-SIZE
    severity: warning
    scope: "paragraphs[?style_id == 'BodyText' || style_id == 'Body' || style_id == 'Normal']"
    when:
      "!=":
        - var: "runs.0.font_size_pt"
        - 12.0
    message: "正文字号应为 12pt（小四）"
    fix:
      action: set
      target: "run.font_size_pt"
      value: 12.0

  - id: PG-BODY-FIRST-LINE-INDENT
    severity: warning
    scope: "paragraphs[?style_id == 'BodyText' || style_id == 'Body' || style_id == 'Normal']"
    when:
      "!=":
        - var: "first_line_indent_cm"
        - 0.74
    message: "正文首行应缩进 2 字符（0.74cm）"
    fix:
      action: set
      target: "paragraph.first_line_indent_cm"
      value: 0.74

  - id: PG-BODY-FONT-EASTASIA
    severity: warning
    scope: "paragraphs[?style_id == 'BodyText' || style_id == 'Body' || style_id == 'Normal']"
    when:
      "!=":
        - var: "runs.0.font_eastasia"
        - "宋体"
    message: '正文字体应为"宋体"'
    fix:
      action: set
      target: "run.font_eastasia"
      value: "宋体"

  - id: PG-BODY-SPACE-BEFORE
    severity: warning
    scope: "paragraphs[?style_id == 'BodyText' || style_id == 'Body' || style_id == 'Normal']"
    when:
      "!=":
        - var: "space_before_pt"
        - 0.0
    message: "正文段前应为 0pt"
    fix:
      action: set
      target: "paragraph.space_before_pt"
      value: 0.0

  - id: PG-BODY-SPACE-AFTER
    severity: warning
    scope: "paragraphs[?style_id == 'BodyText' || style_id == 'Body' || style_id == 'Normal']"
    when:
      "!=":
        - var: "space_after_pt"
        - 0.0
    message: "正文段后应为 0pt"
    fix:
      action: set
      target: "paragraph.space_after_pt"
      value: 0.0

  # ===== 标题 (4 条) =====

  - id: PG-H1-FONT
    severity: warning
    scope: "paragraphs[?style_id == 'Heading 1' || style_id == 'heading 1' || style_id == 'h1' || style_id == '1' || style_id == 'Heading1']"
    when:
      "!=":
        - var: "runs.0.font_eastasia"
        - "黑体"
    message: '一级标题应为黑体'
    fix:
      action: set
      target: "run.font_eastasia"
      value: "黑体"

  - id: PG-H2-FONT
    severity: warning
    scope: "paragraphs[?style_id == 'Heading 2' || style_id == 'heading 2' || style_id == 'h2' || style_id == '2' || style_id == 'Heading2']"
    when:
      "!=":
        - var: "runs.0.font_eastasia"
        - "黑体"
    message: '二级标题应为黑体'
    fix:
      action: set
      target: "run.font_eastasia"
      value: "黑体"

  - id: PG-H3-FONT
    severity: warning
    scope: "paragraphs[?style_id == 'Heading 3' || style_id == 'heading 3' || style_id == 'h3' || style_id == '3' || style_id == 'Heading3']"
    when:
      "!=":
        - var: "runs.0.font_eastasia"
        - "黑体"
    message: '三级标题应为黑体'
    fix:
      action: set
      target: "run.font_eastasia"
      value: "黑体"

  - id: PG-CHAPTER-PAGE-BREAK
    severity: warning
    scope: "paragraphs[?style_id == 'Heading 1' || style_id == 'heading 1' || style_id == 'h1' || style_id == '1' || style_id == 'Heading1']"
    when:
      "==":
        - var: "is_page_break_before"
        - false
    message: "一级标题（章）应分页前"
    fix:
      action: set
      target: "paragraph.page_break_before"
      value: true

  # ===== 图表 (2 条) =====

  - id: PG-FIGURE-CAPTION-ALIGN
    severity: info
    scope: "paragraphs[?style_id == 'FigureCaption' || style_id == '图注']"
    when:
      "!=":
        - var: "alignment"
        - "center"
    message: "图注应居中"
    fix:
      action: set
      target: "paragraph.alignment"
      value: "center"

  - id: PG-TABLE-CAPTION-ALIGN
    severity: info
    scope: "paragraphs[?style_id == 'TableCaption' || style_id == '表注']"
    when:
      "!=":
        - var: "alignment"
        - "center"
    message: "表注应居中"
    fix:
      action: set
      target: "paragraph.alignment"
      value: "center"

  - id: PG-TABLE-CELL-FONT-SIZE
    severity: info
    scope: "paragraphs[?table_index != `null` && runs[?font_size_pt != `10.5`]]"
    when:
      "==":
        - true
        - true
    message: "表格单元格文字字号建议为 10.5pt（小五）"
    fix:
      action: set
      target: "runs.*.font_size_pt"
      value: 10.5

  - id: PG-LIST-LINE-SPACING
    severity: info
    scope: "paragraphs[?list_type != `null`]"
    when:
      "!=":
        - var: "line_spacing"
        - 1.5
    message: "列表段落行距应为 1.5 倍"
    fix:
      action: set
      target: "paragraph.line_spacing"
      value: 1.5
