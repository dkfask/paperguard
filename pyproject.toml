[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperguard"
version = "0.1.0"
description = "PaperGuard thesis formatting checker and fixer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt5>=5.15.0",
  "python-docx>=1.0.0",
  "lxml>=4.9.0",
  "pyyaml>=6.0",
  "json-logic-qubit>=0.9.1",
  "jmespath>=1.0.1",
  "pydantic>=2.5.0",
  "click>=8.0",
  "jinja2>=3.1,<4",
]

[project.scripts]
paperguard = "app.cli.main:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core.rules.packs" = ["*.yaml"]
