          由 AC-06 机器门禁守护。X-Expected-Tenant 头仅限 require_platform_admin，
          普通路径出现即 400 TENANT_OVERRIDE_FORBIDDEN——不与本 AT 冲突。
    blockers: [ADR-02, AC-FIX-1, AC-FIX-6]
    gate_state: ready_to_design
