    blockers: [BQ-FIX-1]
    gate_state: partially_evidenced

  - id: AT-28
    stage: C0
    work_package: W-09/10
    scenario: 人工归档恢复，现有产物与任务状态不同
    criterion: 先核对 manifest；正式修复有审计，真实下载一致
    related_findings: [W-5]
    current_evidence:
      - ref: backend/app/services/backup_restore.py
        state: design_ready
        note: >
