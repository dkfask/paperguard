    blockers: [T-ENABLE-MULTI-TENANT]
    gate_state: partially_evidenced
    note: 明文落库的**降级路径**仍然存在，本 AT 的「新写不落明文」当前不成立。

  - id: AT-19
    stage: C0
    work_package: W-07/08
    scenario: 成员 BYOK 密钥错误与平台端点故障
    criterion: 凭据故障不熔断其他租户；公共故障保护生效
    related_findings: [M-1]
    current_evidence:
      - ref: backend/tests/test_ai_breaker.py
        state: local_gate_passed
        note: 熔断为**进程内单例**（ai_breaker 模块级），多副本下各副本独立
    blockers: [T-ENABLE-MULTI-TENANT]
    gate_state: partially_evidenced
    note: >
      熔断 key 为 _breaker_key(cfg)，按 base_url 聚合——
      单租户的 BYOK 凭据错误确实不会熔断其他租户。但**公共故障保护**
      的「公共」边界需在多租户下重新定义（哪些 base_url 算公共）。

  - id: AT-20
