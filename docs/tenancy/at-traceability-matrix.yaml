    work_package: W-07
    scenario: 私网/环回/重定向/DNS 重绑定出站
    criterion: 应用与网络控制拒绝，无内部资源读取
    related_findings: [F-5]
    current_evidence:
      - ref: backend/tests/test_ai_metering_coverage.py::test_outbound_blocked_does_not_consume_quota
        state: local_gate_passed
        note: >
          F-5 修复后出站守卫覆盖全部 7 个派发点（此前只有 3 个），
