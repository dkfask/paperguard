        state: local_gate_passed
        note: >
          13 条用例逐派发点断言记账与配额；6 条参数化用例验证
          「被限流/出站拦截时不触达上游」。4 项变异测试零假绿。
      - ref: backend/tests/test_ai_governance.py::test_assist_endpoint_enforces_quota_over_http
        state: local_gate_passed
    blockers: [MR-FIX-8, MR-FIX-9]
    gate_state: partially_evidenced
    note: >
      判据前半（「没有上游派发」）已达成：六个派发点均有参数化用例守护，
      变异测试确认删除守卫会被捕获。
      判据后半（「风控尝试与消耗分开记录」）**完全未实现**——M-6：
      全仓无 ai_attempt / quota_denied 概念（grep 0 命中），
      被限流/熔断/出站拦下的尝试不留任何痕。
      后果：熔断打开时 ai_usage 一行不增，看起来像「用户不活跃」，
      实际是系统完全不可用。设计见 ai-metering-runbook.md §8。

  - id: AT-22
