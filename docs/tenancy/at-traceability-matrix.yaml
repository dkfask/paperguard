# AT-ID 验收追溯矩阵
#
# 配套：at-traceability-framework.md（框架与放行判据）
#       tools/at_traceability_check.py（一致性校验器）
# 来源：docs/product/saas-platform-design-20261001.md §24.2
#
# 本文件**不得手工编辑** `id` / `stage` / `work_package` / `scenario` / `criterion`
# 五个字段——校验器会逐字段比对设计文档，任何漂移都会失败。
# 可编辑的只有 `related_findings` / `current_evidence` / `blockers` / `gate_state`。
#
# 语义：
#   related_findings  本轮设计取证中，与该 AT-ID 直接相关的发现编号
#   current_evidence  当前**已有**的证据及其六态；不含任何"应该会有"的证据
#   blockers         阻塞该 AT-ID 落地的前置项
#   gate_state       not_started | partially_evidenced | ready_to_design | blocked_on_scope
#
# 六态（与全项目引用规范一致）：
#   local_fixed / local_gate_passed / committed_pushed /
#   merged / deployed / runtime_verified / strict_uat_passed

meta:
  source: docs/product/saas-platform-design-20261001.md
  source_section: "24.2 核心验收用例提案"
  baseline_head: e166f97
  authored: "2026-10-01"
  total_at_ids: 45
  important: >
    设计文档 §24.2 原文写明「以下是下一阶段需要实现的测试，**不是本次已执行结果**」。
    本矩阵中**没有任何一条** gate_state 达到 strict_uat_passed，这是正确状态而非缺陷。

# ---------------------------------------------------------------------------
# 阶段与工作包（用于按阶段放行）
# ---------------------------------------------------------------------------
stages:
  C0:
    work_packages: [W-03, W-04, W-05, W-06, W-07, W-08, W-09, W-10]
    at_range: [AT-01, AT-34]
    description: 租户安全底座 + 教学试点
    gate: C0 放行需 AT-01～AT-34 全部 strict_uat_passed
  C1:
    work_packages: [W-11]
    at_range: [AT-35, AT-39]
    description: 账务与计费
    gate: 依赖 C0 放行 + MR-FIX-1～4 完成（见 ai-metering-runbook.md §5.2）
  C2:
    work_packages: [W-12]
    at_range: [AT-40, AT-42]
    description: 支付与退款
    gate: 依赖 C1 放行
  cross:
    work_packages: [W-13]
    at_range: [AT-43, AT-45]
    description: 跨阶段（SSO、UAT、迁移）
    gate: 按其出现的阶段分别放行

# ---------------------------------------------------------------------------
# 逐条追溯
# ---------------------------------------------------------------------------
