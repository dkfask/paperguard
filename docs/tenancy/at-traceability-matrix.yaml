  # ===== C0 / worker 与任务 =====
  - id: AT-25
    stage: C0
    work_package: W-09
    scenario: worker 重启、租约过期、长任务心跳
    criterion: 旧 worker 无法发布或更新；新进程可收敛
    related_findings: []
    current_evidence:
      - ref: backend/app/db.py claim_jobs
        state: local_gate_passed
        note: >
          租约令牌 + BEGIN IMMEDIATE 原子抢占 + lease_until 过期回收已实现；
          租约时长 300s（归档/导出/渲染）、120s（outbox）。
          backend/tests/test_ai_breaker.py 等有租约相关覆盖。
    blockers: []
    gate_state: partially_evidenced
    note: >
      **长任务心跳**当前无实现：claim 时一次性设置 lease_until，
      任务执行超过 lease_seconds 后租约即过期，可能被第二个 worker 抢占。
      三个消费者均用 300s 租约，文档渲染任务有可能超过。

  - id: AT-26
    stage: C0
    work_package: W-09
    scenario: 同任务/事件重复消费，附件孤儿与取消竞争
    criterion: 不重复生成已发布效果，孤儿安全隔离，终态一致
    related_findings: []
    current_evidence:
      - ref: backend/tests/test_ai_breaker.py
        state: local_gate_passed
        note: 终态 park 与人工重试入口已验证
    blockers: [T-ENABLE-MULTI-TENANT]
    gate_state: partially_evidenced

  - id: AT-27
    stage: C0
    work_package: W-09
    scenario: 一个租户积压、大任务与普通任务竞争
    criterion: 租户资源限额和公平策略有效，无无限热重试
    related_findings: [BQ-2]
    current_evidence:
      - ref: quota-and-billing-review.md §3
