    blockers: [AC-FIX-3]
    gate_state: partially_evidenced
    note: >
      敏感字段扫描**无自动化门禁**。当前 367 处错误用裸字符串，
      其中部分可能内联上游返回内容（_parse_error_detail 的结果直接进 detail），
      存在把上游错误正文写进日志/响应的风险。

