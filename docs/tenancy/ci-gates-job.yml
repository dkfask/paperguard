## 接入方式

**权威副本是 `.github/workflows/ci.yml` 里的 `design-gates` job**。
本文件**不再重复贴一份 YAML**。

> ★ **INC-118 为什么删掉这段副本**
>
> 复制出来的 job 与真身**已经漂移**：两份都还写着「本机实跑 195s；
> CI 还要装依赖，给足余量但防挂死」，而该数字在装上 `pglast` 之后
> **早已不成立**（本地实测整套 401s）。
>
> 更严重的是**双跑**：副本与真身都是「`--mode ci` 跑一遍、
> `--mode report` 再跑一遍」，而 `--mode report` 只改退出码、
> **不跳过任何门禁**，于是 42 道门禁在 CI 里被完整执行**两次**，
> 实测 8 分 09 秒 ×2 = 16 分 45 秒 > `timeout-minutes: 15`
> ⇒ **job 被 GitHub 直接杀掉**，run 结论是 `cancelled`，
> 连「是哪道门禁红了」都看不到。
>
> ★ 这一类是本项目反复踩到的坑：INC-78 是两份 `rule_ids` 提取逻辑各自腐烂，
>   INC-111 是覆盖面只能靠枚举法取得而非否定式扫描。
>   共同教训是：**同一份东西存在两份时，先确定谁是权威，然后删掉另一份**——
>   而不是加一句「两边要同步」。**提醒拦不住任何人，副本会烂。**
>
> 要看或要改 job 定义，请直接打开 `.github/workflows/ci.yml`。

