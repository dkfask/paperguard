# 门禁套件 CI 接入片段（**已接入 `.github/workflows/ci.yml` 并本地模拟验证**）

> **当前状态（2026-10-02 实测）**
>
> ① `docs/tenancy/`、`docs/product/W-0x-*.md` 与 21 个门禁工具
> **已于 `43bdccf` 纳入版本控制**（此前「全部未被 git 跟踪」的说法已过期）。
> ② `design-gates` job **已追加到 `.github/workflows/ci.yml`**，
> 与 `backend` / `frontend` / `online-verifier` 平级。
> ③ **已按 CI 的方式实跑验证过工作目录无关性**：从 `backend/` 目录调用，
> 与从仓库根运行**逐项一致** ⇒ 工具靠 `__file__` 上溯三级定位仓库根。
>
> ④ ★ **已在真正的干净检出上实测**（2026-10-03，`git clone` 到临时目录后实跑
> 全套，`HEAD=3313b57`）。**这一步是补上 ③ 的漏洞**：③ 只验证了「工作目录不影响
> 定位」，**没有验证「干净检出里该有的文件都在」**，而后者才是 CI 的真实初始条件。
> 实测结果 `total=40 · 通过 31 / 差距 7 / 不可运行 1 / 不适用 1`，
> 其中唯一那个「不可运行」是本机缺 `pglast`（CI 会装上）。详见 [INC-94]。
>
> **但门禁仍不会自动生效，原因有两个，都不是本文件能解决的**：
>
> - **触发条件**：`ci.yml` 的 `on:` 只有 `push: branches: [main]` 与
>   `pull_request: branches: [main]`。**在 feature 分支上推送不会触发它**，
>   必须合入 main 或开 PR 到 main。
> - **`ddl_static_check` 第 2 层在 CI 上才是首次真实运行**：本机缺 `pglast`，
>   该层从未执行过；CI 会装上 `pglast>=6.0`（`requirements-dev.txt:18`）。
>   **所以本机这组数字不能等同于 CI 会看到什么。**
>
> **为什么单独放这里而不是直接改 `.github/workflows/ci.yml`**
>
> 原先是怕 `actions/checkout` 拿不到未跟踪文件，导致第一次运行整片红
> （工具文件不存在 → 全部记为「工具不可运行」）。
> **该前提已不成立**：工具现已提交，接入不再有这个风险。

---

## 接入方式

把下面整个 job 追加到 `.github/workflows/ci.yml` 的 `jobs:` 下（与 `backend`、
`frontend`、`online-verifier` 平级）。

```yaml
  design-gates:
    name: Design gates (tenancy toolchain)
    runs-on: ubuntu-latest
    # 本机实跑 195s；CI 还要装依赖，给足余量但防挂死
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # whitespace_check 要用 `origin/<base>..HEAD` 核对本次 PR 的变更。
          # checkout 默认 fetch-depth: 1（浅克隆），取不到 origin/main；
          # 而该工具对「不可核对」是**报红**而不是放行——所以必须拉全历史。
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # `cache: pip` 默认只匹配 **/requirements.txt；本仓只有
          # requirements-dev.txt，不显式指定会发「no file matched」警告。
          # 这不是失败，但会让人误以为缓存坏了。
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt      # 含 pglast，ddl_static_check 需要
      - name: Build schema-only SQLite DB
        # backend/data/ 在 .gitignore:75 被刻意排除，CI 检出后没有 paperguard.db
        # ⇒ schema_disposition_check 找不到库 ⇒ exit=2 ⇒ --mode ci 拦 ⇒ 流水线红。
        # 这里用**应用自己的建表语句**建只含表、无数据的库（不是伪造数据）。
        run: |
          mkdir -p data
          python -c "
          import sys; sys.path.insert(0, '.')
          from app.db import Store
          Store('data/paperguard.db')._init_schema()
          print('schema-only DB ready')
          "
      - name: Run gate suite (ci mode)
        run: python ../docs/tenancy/tools/run_all_gates.py --mode ci
      - name: Publish gate report
        if: always()
        # 产出的 `gate-report.json` 有两处必须知道：
        #
        # ① `passed`/`gaps`/`broken`/`exit` 的键是 **`工具::kind`**
        #    （如 `ddl_static_check.py::plain`），不是裸工具名——同一工具的
        #    self-test 与 plain 是两条独立门禁，退出码可以不同（INC-67）。
        #    写下游消费者时不要按工具名去重，那会把 31 条压成 18 条。
        #
        # ② `input_drift` 列出运行期间被改写的「设计真相」文件（INC-68）。
        #    **非空就说明这份报告不能作为证据**，即使它看起来全绿。
        #    CI 上文件不会在运行期间被改，所以本字段预期恒为 `[]`；
        #    它不为空时应当排查是否有并发写入。
        run: python ../docs/tenancy/tools/run_all_gates.py --mode report --json > gate-report.json
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-gate-report
          path: backend/gate-report.json
```

---

## 这个 job 什么时候会红

`run_all_gates.py` 的两种模式，**行为完全不同，不要混用**：

| 模式 | 失败条件 | 什么时候会红 |
|---|---|---|
| `--mode ci` | 出现**退出码 2**（工具不可运行） | 缺依赖、工具文件不存在、路径失效 |
| `--mode strict` | 出现退出码 **1 或 2** | 任何「差距已记录」也会红 |
| `--mode report` | 永不失败 | 只出报告 |

**`--mode ci` 是这里唯一正确的选择。** 理由：

当前门禁里有 **6 道 `plain` 检查是按设计常红**的——
（2026-10-02 核对：此处原文写「3 道」却列了 4 行，且漏列 2 道，已按实跑结果更正；
**过期陈述比没有陈述更危险**，读者会照着它判断「哪些红是正常的」）

| 门禁 | 状态 | 含义 |
|---|---|---|
| `api_contract_check` | `1` | 8/9 项契约债未偿还（已登记、已跟踪） |
| `synthetic_data` | `1` | §24.1 验收前置数据 5 项缺口（`T-ENABLE-MULTI-TENANT` 未解除） |
| `account_path_check` | `1` | 3 条建号路径不写 `organization_context`（INC-09，待产品裁决） |
| ~~`contract_readiness_check`~~ | **CI 下 `N/A`** | 隔离清单 22 行未清零 + INC-03/04 未裁决。**本机 `1`，但 CI 下判为「不适用」**——它的主语是本地开发库的**数据**，而 `backend/data/` 不在版本控制里（[INC-94]） |
| `context_resolution_check` | `1` | 缺 `__post_init__`、CI-1～CI-4 未落地，114 处 `role` 仍需消歧 |
| `lease_guard_check` | `1` | 2 处租约通配未消除（`db.py:1676` / `db.py:1791`，INC-30/47） |

**这 6 道的 `1` 表示「差距是真实的，且已被量化登记」，不是「门禁坏了」。**
拿它们拦 CI，流水线从第一天起就是红的，**很快就没人再看红绿**——
那才是真正把门禁废掉的方式。

只有退出码 `2` 才代表门禁**自己**坏了（依赖缺失、路径失效、退出码越界），
那种情况必须拦。

> ★ **这张表是本机实跑快照，不是 CI 的承诺。**
> 但它**不再是靠推断的**了——2026-10-03 已在干净克隆上实测过 CI 条件
> （`通过 31 / 差距 7 / 不可运行 1 / 不适用 1`）。
> **仍然未验证的只剩一件事**：`ddl_static_check` 的 `plain` 在装了 `pglast` 后的
> 行为**一次都没跑过**——本机跑的是「缺 pglast ⇒ exit=2」这条路径。
> 若它在 CI 上报 `2`，`--mode ci` 会拦，流水线会红；**这是唯一已知的开跑风险**。
>
> **这张表没有覆盖「清单变了」**——门禁增减后必须重新核对，
> 而这一点目前**没有机器判据**（§27.5 的 `fact275:gate_all_*` 只覆盖设计文档里的三态，
> 覆盖不到本文件的这张表）。

## 「本模式不适用」（N/A）是什么

`run_all_gates.py` 有第四种状态 `--mode ci` 下**跑、如实记下真实退出码、
单独列出、不进三态、不参与退出码**。它只用于**主语不在版本控制里**的门禁
（当前只有 `contract_readiness_check::plain`），每一条都必须在
`CI_INAPPLICABLE` 里**写明理由**。

- 它**不是**「让门禁通过」——报告里能看见它实跑返回了什么。
- 它**只在 `--mode ci` 生效**，且**只在实跑确实没跑成（exit=2）时才生效**——
  在有本地库的机器上那道门禁返回 1 并报出真实缺口，**必须照常计入**。
  （首版漏了第二个条件，本机实跑时真实差距被凭空抹掉，自检已锁死。）
- `strict` / `report` 下照常判定，**不许恒豁免**。
- `--json` 里是单独的 `na` 数组；`exit` 明细里**仍保留**它的真实退出码。
- DC-1 对「本模式不适用且实跑返回 2」的门禁**不再比对退出码**，但会打一行 `△` 说明跳过了。
  两个条件必须同时满足，否则不得豁免。

**不要用「让它 exit=0」来解决这类问题**——那是空洞通过（INC-56 / INC-70 / INC-92）。

## 首次运行需要盯的两点

1. **`ddl_static_check` 的 `plain` 模式从未在本机跑过**——本机没有 `pglast`，
   它的真实行为（会报 0 还是 1）**未经验证**。CI 装了 `requirements-dev.txt` 后
   才有 `pglast`。如果它报 `1`，那是正常结果（DDL 草案有外键问题），
   **不会让 CI 变红**；只有报 `2` 才需要排查。

2. **判定逻辑已单独覆盖**。`ddl_static_check.py --self-test` 不依赖 `pglast`，
   已纳入门禁套件，因此「0 张表被误判为通过」这类空转假绿在 CI 上是被守住的。
