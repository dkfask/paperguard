        - {loc: "backend/app/api/process_records.py:67-75", fn: "_process_file_dir",
           env: "PAPERGUARD_PROCESS_FILE_DIR > PAPERGUARD_DATA_DIR", problem: "不读 DB_PATH"}
        - {loc: "backend/app/services/document_render_jobs.py:35,43-46", fn: "artifact_dir",
           env: "仅 PAPERGUARD_ARTIFACT_DIR", problem: "独立变量，不随 DATA_DIR 联动"}
        - {loc: "backend/app/services/template_source.py:21,24-28", fn: "template_source_dir",
