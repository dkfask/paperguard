    finding: >
      总设计 saas-platform-design-20261001.md:271 假设 DDL 在「启动过程」，
      实际是**每个请求**——`Depends(get_store)` 的注入点分布见 `meta.depends_get_store`
      （由 `resource_registry_check` RR-2 实跑重算，**本文不复述这个数**），
      14 个构造点在请求路径上。
      在 PostgreSQL 上这是 catalog 锁争用与连接池失效的直接来源。
      **W-02 T-02.1 必须先移除此路径，否则 RLS/连接池/事务局部租户设置无从谈起。**
    remediation: W-02:T-02.1
