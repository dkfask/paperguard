        - {loc: "backend/app/services/export_jobs.py:21,159,163,173", fn: "EXPORT_DIR",
           env: "无", problem: "模块级常量，完全硬编码，资产无法重定位"}
        - {loc: "backend/app/api/policies.py:41,538", fn: "_DOCUMENT_DIR",
           env: "无", problem: "模块级常量，完全硬编码，资产无法重定位"}
    reproduced_finding: >
      **DR-02 已本地只读复现**（脚本 /tmp/dr02b.py，不写文件、不触库）：
      仅设 PAPERGUARD_DB_PATH=/custom/vol/paperguard.db 而不设 PAPERGUARD_DATA_DIR 时，
      在线 DB=/custom/vol/paperguard.db，而 backup_restore 的备份根
      = <仓库>/backend/data → **备份根不含在线数据库**。
      对照：两者同设 → 一致；都不设 → 一致。
      触发条件因此精确为「DB_PATH 已设而 DATA_DIR 未设或不同值」。
    impact: >
