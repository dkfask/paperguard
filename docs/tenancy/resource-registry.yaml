authorization_matrix:
  status: design_ready
  document: docs/tenancy/permission-matrix.md
  satisfies: "总设计 2.3 节 U-02 的设计侧交付物；27.3 文档包第 1 项剩余部分"
  route_inventory:
    total: 230
    method: "AST 解析 @router.* 装饰器 + 参数默认值中的 Depends()"
    # ★ INC-86（2026-10-02）：上面这句方法说明**不完整**，而两种「显而易见的实现」
    #   都会得到错数。RR-5 按本段口径实算，缺这段说明时门禁无法自证方法未被改窄。
    method_note: >
      ① 处理器遍历必须同时包含 `ast.FunctionDef` **与 `ast.AsyncFunctionDef`**——
      后者**不是**前者的子类（是兄弟类），只判 `isinstance(n, ast.FunctionDef)`
      会漏掉全部 `async def` 处理器，实测写操作 129 → **116（少 13 条 POST）**。
      ② **不要用 `app.routes` 作为权威**：fastapi 0.141.1 下 `include_router` 的结果是
      15 个 `_IncludedRouter` 包装对象、**不展平**，`len(app.routes)` 只有 **20**。
      权威值须经 `r.original_router.routes` 展平（实测展平后 214，与本文一致）。
      ③ `Depends()` 有**三种出现位置**：参数默认值、路由级 `dependencies=[...]`、
      router 级 `APIRouter(dependencies=[...])`；还必须识别 `Annotated[..., Depends(...)]`。只扫参数默认值**看不见**后两种。
    by_guard:
      current_user: 157
      # ↓ 口径：签名带 `require_manager` **且不带** feature flag 依赖的路由。
      #   **本值原为 25，且原分类只数了「路由级」flag，漏掉 3 个 router 级挂载的 5 条**
      #   （document_packages / document_projects / specs 的 `APIRouter(dependencies=[...])`），
      #   于是那 5 条被错标成「纯 manager」。INC-86 实测正确互斥划分为 **20 + 9 = 29**。
      #   **六项之和仍等于 214**（划分不变量没破），所以原值**看起来完全自洽**。
      require_manager: 20
      require_admin: 7
      trusted_context: 19
      require_template_manager: 6
      # ★ 这个名字**不是代码里的标识符**（全仓 grep 0 命中），而是一个**派生分类**。
      #   真实守卫名是 `require_general_document_platform`（`core/feature_flags.py:22`），
      #   它是 **feature flag**、**不出现在任何处理器签名里**，只出现在
      #   `APIRouter(dependencies=[...])`（3 个模块）与路由级 `dependencies=[...]`（4 条）。
      #   本项口径 = 「签名带 `require_manager` **且** 带该 flag」= 20 之外的 9 条
      #   （templates 4 + specs 4 + document_packages 1）。
      #   **按名字 grep 核对会得到 0**——所以必须写明它是派生量、也必须数全两种挂载位置。
      require_general_document_platform_plus_manager: 9
      # ↓ 口径：**完全不依赖任何签名级守卫**的路由（实测 12）
      none_public: 12
    # ★ `public_routes`（15）与 `by_guard.none_public`（12）是**两个不同口径**，不可互换：
    #   · `none_public` = 无任何签名级守卫（12 条，含 4 条 /health* 与 2 条 /packs*）
    #   · `public_routes` = **无需角色守卫**（15 条 = 上面 12 条 + 3 条
    #     `/mp/bind-email`、`/mp/unbind`、`/mp/subscribe`）
    #   ★ **那 3 条实测都带 `current_user`**（`api/auth.py` 的小程序端点），
    #     **它们不是匿名可访问的**。把它们叫「public」只表示「不要求管理员/经理角色」。
    #     混用会得出「15 ≠ 12，文件写错了」——**原文正是因此看起来自相矛盾**。
    public_routes_note: "本列表口径 = 无需角色守卫（可能仍需登录）；与 none_public 不同口径，见 method_note ③"
    public_routes: ["/register","/login","/email/code","/mp/login","/mp/bind",
                    "/mp/register","/mp/bind-email","/mp/unbind","/mp/subscribe",
                    "/logout","/health","/health/live","/health/ready","/packs","/packs/{pack_id}"]
  organization_visibility:
    admin: "全部组织（access_service.py:27-28）—— 无租户边界"
    college_admin: "自身作用域根 + 全部后代（access_service.py:30-38）"
    teacher_student: "仅自身作用域根（access_service.py:29-31）"
  gaps:
