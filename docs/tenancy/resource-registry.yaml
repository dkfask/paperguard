      - {loc: "backend/app/api/templates.py:61",           form: "Store()", phase: request}
      - {loc: "backend/app/main.py:180",                   form: "Store()", phase: request,
         note: "**在 download_image 端点内逐请求构造**，见 access-surface: image-download-path"}
      - {loc: "backend/app/main.py:77",                    form: "Store()", phase: startup,
         note: "启动函数内；同时调用 recover_pending_archives / recover_pending_exports，见 u09-touchpoint"}
      - {loc: "backend/app/worker.py:35",                  form: "Store()", phase: worker,
         note: "run_once 入口"}
