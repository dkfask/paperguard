# 三、隔离清单：归属未解冲突（不猜测归属）
# ──────────────────────────────────────────────────────────────────────────
isolation_quarantine:
  policy: "无归属历史数据不得猜测归属后直接开放（总设计 4.1 行 / 22.1 行）"
  items:
    - id: Q-01
      resource: organization_units
      conflict: "多根组织树 / 环 / 断链 / 跨校混在一棵树"
      action: "人工确认根组织→租户映射；子树继承并持久化；异常项进本清单"
      owner: 待指定
    - id: Q-02
      resource: document_projects
      conflict: "个人历史项目无机构归属"
      action: "**不自动分给当前学校**；需客户确认或标记为个人资产"
      owner: 待指定
    - id: Q-03
      resource: templates
      conflict: "无法区分平台公共资产与租户私有资产"
      action: "逐条判定 asset_scope；客户未发布模板永不变成公共资源（总设计 8.3 行）"
      owner: 待指定
    - id: Q-04
      resource: workflow_records
      conflict: "kind 清单未枚举，单列 tenant_id 无法表达多业务混装"
      action: "枚举 kind → 逐 kind 定归属 → 决定拆表或加 resource_type"
      owner: 待指定
      blocks: "W-02 T-02.4 DDL 定稿"
      status: RESOLVED
      resolution: >
        2026-10-01 已枚举 17 种 kind，全部有确定归属路径。
        结论：维持单表 + 单列 tenant_id，**不需拆表**；加 owner_ref 固化父引用。
        见 docs/tenancy/workflow-records-kind-inventory.md。
        残余：CHK-01～06 字段空值率待生产只读实测。
    - id: Q-05
      resource: system_settings
      conflict: "organization_id='' 同时表示平台默认与历史存量"
      action: "拆为 scope_type + scope_id 三态显式建模"
      owner: 待指定
      status: RESOLVED
      resolution: >
        2026-10-01 已完成分析 → docs/tenancy/system-settings-scope-inventory.md。
        实际只有 2 个设置键（ai_default_config / retention_policy）。
        拆分依据：db.py:471-473 的 0010 迁移是确定性的，可用 schema_migrations
        中 0010_tenant_system_settings 的 applied_at 作分界，**不可凭值猜测**。
        连带发现 5 个 AI 配置解析链差距（G-1~G-5），其中
        **G-3（users.ai_config 无组织维度 → BYOK 不绑定租户成员）属 W-07 最高风险项**。
        动作 W-05-A/B/C 交 W-02；W-07-A/B/C、D 交 W-07/W-06。
    - id: Q-06
      resource: audit_events
      conflict: "老事件缺 request_id / 操作者"
      action: "标 legacy；**不伪造**（总设计第 10 节）"
      owner: 待指定
    - id: Q-07
      resource: workflow_records
      conflict: >
        document_template_candidate / document_spec_candidate 是
        manager 级全局解析队列，**不携带 template_id / spec_id**，
        API（api/templates.py:257、api/specs.py:113）无任何租户参数。
        无法判定其为平台公共资产候选还是租户资产候选。
      action: "产品 + D-01/D-08 裁决作用域；裁决前不得猜测归属"
      owner: 产品
      added: "2026-10-01（Q-04 处置时发现）"
    - id: Q-08
      resource: "users.teacher_id + workflow_records(kind=supervision)"
      conflict: >
        指导关系有两套异构来源：users.teacher_id（全局、单值、无批次）与
        supervision（cohort_id 内、带 state）。api/teacher.py:24-33 用
        **OR 语义**判定（任一命中即成立），api/teacher.py:143 确认
        **解绑只解账号绑定**。两者可互相矛盾 → 两位教师同时可访问该学生。
      action: "产品 + 教师教学负责人裁决迁移取哪个来源、是否保留 OR 语义"
      owner: "产品 + 教师教学负责人"
      added: "2026-10-01（账号迁移清单）"
      note: "本地开发库 supervision=0 条，冲突场景本地不可复现，须生产只读实测"
    - id: Q-09
      resource: users
      conflict: "旧 admin 的平台角色映射未裁决（总设计 22.1 行禁止自动升为平台超管）"
      action: "产品 + D-01 裁决哪些 admin 成为 platform_role_bindings、哪些成为租户所有者"
      owner: 产品
      added: "2026-10-01（账号迁移清单）"
    - id: Q-10
