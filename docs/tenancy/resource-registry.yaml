# PaperGuard 租户资源登记表（机器可读）
#
# 状态：design_ready — 本表是**登记产物**，不是实施结果。未执行任何 DDL/DML。
# 运行时清单更新：上一阶段 d876798 已推送；本轮归属准入/显式批准/写作切片来源 1154b94，2026-10-04 AST 实测；不表示隔离设计已实现。
# 上游规格：docs/product/W-01-预检与ADR实施规格_20261001.md（T-01.4）
# 消费方：docs/product/W-02-存储与Schema实施规格_20261001.md §4（逐表归属判定）
# 总设计要求：saas-platform-design-20261001.md:438「未登记入口不放行共享 SaaS」
#
# ── 字段语义 ──────────────────────────────────────────────────────────────
# tenant_derivable:
#   direct      — 资源自身或其直接外键可确定归属，需新增 tenant_id
#   derived     — 需经父资源链推导（项目→成员、事件→资源）
#   conditional — 取决于业务语义或数据分区，迁移前必须逐条判定
#   none        — 按 ADR-03 属全局对象，**不得**加 tenant_id
# sensitivity: 对应总设计 20.1 节的六类数据分级
# migration_rule:
#   expand_sidecar — 加 nullable 侧边列（expand 阶段不动现有约束与写入路径）
#   new_table      — 建新表，contract 阶段再收缩旧表
#   unique_extend  — 需扩展现有 UNIQUE 约束（共享库下会跨租户撞键）
#   pk_extend      — 需扩展现有主键
#   ledger_replace — 由 W-02 T-02.2 的新迁移账本替代
#   no_change      — 本阶段不动
# registry_status:
#   registered     — 已登记，归属规则明确
#   registered_gap — 已登记，但**归属存在未解冲突**，见 isolation_quarantine
#   out_of_scope   — 非客户数据对象（文档/构建产物/测试夹具）
# ──────────────────────────────────────────────────────────────────────────

meta:
  source_sha: 1154b943ed2801c82d649e4b365fafb259f85e3e
  branch: fix/ui-review-findings-20260929
  generated_at: "2026-10-04"
  store_public_methods: 127        # 实测：ast 解析，排除 _ 前缀
  store_total_methods: 136         # 实测：含私有方法
  store_construction_points: 18    # 实测：16 × Store() + 1 × Store(db_path)
  store_construction_by_phase:
    request: 15        # Depends(get_store) 12×api/* + auth.py:617 + main.py:178
    startup: 1         # main.py:77
    worker: 1          # worker.py:35
    cli: 1             # cli/migrate.py:19（Store(db_path)）
  depends_get_store: 219          # 实测：**AST 表达式计数**，口径 = 真实的
                                  # `Depends(get_store)` 调用，不含文档字符串/注释。
                                  # INC-85：原写 202，是 grep 行数——`auth.py:613`
                                  # 的 docstring 里有一句「全项目统一用 `Depends(get_store)` 注入」
                                  # 被当成了一次注入。**这正是下一行 grep_false_negatives
                                  # 记录的那个陷阱，只是当时没应用到它自己。**
  grep_false_negatives: >
    按表名 grep 会漏（10 张表 0 命中却是热路径）；
    按 "Store()" 字符串 grep 会把 auth.py:613 的**文档字符串**
    （`Depends(lambda: Store())` 的说明文字）误计为调用点。
    **两个数都要用 AST 表达式计数，不要用 grep 行数。**
    （本行原文写「实测 17 vs 实际 16」，2026-10-01 实测已变为 **18 vs 17**：
    `Store(` 的 grep 命中 18 行、其中 1 行是上面那句文档字符串。）
  # ↑ 下方所有数字均由 docs/tenancy/tools/resource_registry_check.py 实跑重算（RR-2）。
  #   它们此前**没有任何机器核对过**，而 `depends_get_store` 已经因此错了 1（202→201）。
  tables_registered: 30
  business_tables: 29
  # 「哪张表不是业务表」是**人工判断**。此前只写了 24 而没写怎么排除的，
  # 于是这个数字**不可复算**——RR-2 无从核对。把排除清单显式列出来。
  # **编一个默认值比留空更危险**：留空时没人知道 24 是怎么来的，
  # 写死 24 时同样没人知道，所以只能列出**排除谁**这一件事本身。
  business_tables_excludes: [schema_migrations]   # 迁移账本，非客户业务对象
  access_surface: Store 方法      # 见 access_surface_note
  access_surface_note: >
    访问面是 **Store 的 127 个公开方法**，不是表名。按表名 grep 在 10 张表上
    返回 0 命中却是真实热路径（例：workflow_records 被 api/workflow.py、
    services/export_jobs.py、repositories/workflow_repository.py 大量使用，
    但这些文件都不出现该表名字符串）。**登记表与后续隔离改造一律以方法为入口。**

