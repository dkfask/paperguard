      conflict: "role='user'（已注册未选定学校角色）的账号是否需要个人租户承载"
      action: "产品裁决（总设计 1.2 行：个人商业租户不在机构试点中自动启用）"
      owner: 产品
      added: "2026-10-01（账号迁移清单）"
    - id: Q-11
