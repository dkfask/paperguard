  - id: image-download-path
    description: "backend/app/main.py:176-180 GET /media/uploads/{filename}"
    severity: high
    finding: >
      端点内 `store = Store()` 逐请求构造，并调用 **store.list_projects() 拉取全部项目**，
      再在 Python 里用 `project_image_urls` 过滤决定 permitted。
      三个问题：(1) 触发上述 per-request DDL；(2) **全表扫描所有租户的项目**，
      共享库下是跨租户数据面全量读；(3) 文件授权在应用层逐项目比对，
      不是数据库/目录级授权 —— 对应 AT-13「鉴权前无文件内容、无旧静态旁路」。
      总设计 20.2 行要求浏览器只传逻辑对象 ID、鉴权后由目录记录授权。
    registered_as: "projects 表 / image 授权路径"
    remediation: "W-02:T-02.1（构造点）+ W-04:AT-13（文件授权模型）"
    registry_status: registered
    risk_flags: [per_request_ddl, cross_tenant_full_table_read, app_layer_only_file_authz]

