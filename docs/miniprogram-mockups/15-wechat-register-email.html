<!-- Center Headline (Matches JSON Anchor) -->

            </span>

</div>
</div>

<!-- User Context Bar -->

</div>
<span class="text-body-sm font-body-sm text-on-surface">当前账号：<span class="font-code-sm text-code-sm font-medium">wx_a3f9**81</span></span>
</div>
<!-- Triple Signaling Status Tag: Approved/Logged In -->

        </p>

<!-- 3. Form Core Card -->
<form class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 p-4.5 custom-card-shadow space-y-4" id="bindEmailForm" onsubmit="event.preventDefault(); handleFormSubmit();">
<!-- Field 1: Email Address -->
<div class="space-y-1.5">
<label class="block text-label-md font-label-md text-on-surface font-medium" for="emailInput">
          常用或机构邮箱 <span class="text-error">*</span>
</label>
<div class="relative flex items-center">
<div class="absolute left-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]" data-icon="mail">mail</span>
</div>
<input class="w-full h-10 pl-9 pr-3 rounded-lg border border-outline-variant/50 bg-surface-container-lowest text-on-surface placeholder:text-outline/70 text-body-sm font-body-sm transition-all focus:border-primary-container focus:ring-2 focus:ring-primary-container/15" id="emailInput" name="email" placeholder="请输入常用邮箱或高校教育邮箱 (如 name@edu.cn)" required="" type="email"/>
</div>
</div>
<!-- Field 2: Verification Code -->
<div class="space-y-1.5">

          验证码 <span class="text-error">*</span>
</label>

</div>
<input class="w-full h-10 pl-9 pr-3 font-code-sm text-code-sm rounded-lg border border-outline-variant/50 bg-surface-container-lowest text-on-surface placeholder:text-outline/70 transition-all focus:border-primary-container focus:ring-2 focus:ring-primary-container/15" id="codeInput" inputmode="numeric" maxlength="6" placeholder="6 位验证码" type="text"/>
</div>
<button class="h-10 px-3.5 text-label-md font-label-md font-medium text-white bg-primary-container hover:bg-[#2563eb] rounded-lg transition-colors shadow-2xs whitespace-nowrap active:opacity-85 flex items-center justify-center min-w-[100px]" id="sendCodeBtn" onclick="triggerCodeCountdown()" type="button">
            获取验证码
          </button>
</div>
<p class="text-[11px] leading-4 text-on-surface-variant flex items-center space-x-1">
<span class="material-symbols-outlined text-[13px] text-outline" data-icon="help_outline">help_outline</span>
<span>校园邮件服务未接入时无需验证码，直接输入常用邮箱</span>
</p>
</div>
<!-- Field 3: New Password -->
<div class="space-y-1.5">
<label class="block text-label-md font-label-md text-on-surface font-medium" for="passwordInput">
          设置电脑端登录密码 <span class="text-error">*</span>
</label>
<div class="relative flex items-center">
<div class="absolute left-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]" data-icon="lock">lock</span>
</div>
<input class="w-full h-10 pl-9 pr-10 rounded-lg border border-outline-variant/50 bg-surface-container-lowest text-on-surface placeholder:text-outline/70 text-body-sm font-body-sm transition-all focus:border-primary-container focus:ring-2 focus:ring-primary-container/15 font-code-sm" id="passwordInput" minlength="12" oninput="validatePasswordStrength()" placeholder="输入新密码" required="" type="password"/>
<button aria-label="显示或隐藏密码" class="absolute right-2.5 p-1 text-outline hover:text-on-surface transition-colors" onclick="togglePasswordVisibility('passwordInput', 'pwToggleIcon1')" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility_off" id="pwToggleIcon1">visibility_off</span>
</button>
</div>
<div class="flex items-center justify-between text-[11px] leading-4 text-on-surface-variant">
<span id="pwdRuleText">至少 12 位，建议包含字母、数字及符号</span>
<span class="hidden font-code-sm font-medium" id="pwdStrengthBadge"></span>
</div>
</div>
<!-- Field 4: Confirm Password -->
<div class="space-y-1.5">
<label class="block text-label-md font-label-md text-on-surface font-medium" for="confirmPasswordInput">
          确认登录密码 <span class="text-error">*</span>
</label>
<div class="relative flex items-center">
<div class="absolute left-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]" data-icon="lock_reset">lock_reset</span>
</div>
<input class="w-full h-10 pl-9 pr-10 rounded-lg border border-outline-variant/50 bg-surface-container-lowest text-on-surface placeholder:text-outline/70 text-body-sm font-body-sm transition-all focus:border-primary-container focus:ring-2 focus:ring-primary-container/15 font-code-sm" id="confirmPasswordInput" oninput="validatePasswordMatch()" placeholder="请再次输入新密码" required="" type="password"/>
<button aria-label="显示或隐藏确认密码" class="absolute right-2.5 p-1 text-outline hover:text-on-surface transition-colors" onclick="togglePasswordVisibility('confirmPasswordInput', 'pwToggleIcon2')" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility_off" id="pwToggleIcon2">visibility_off</span>
</button>
</div>
<div class="text-[11px] leading-4 hidden items-center space-x-1" id="matchNotice">
<span class="material-symbols-outlined text-[13px]" data-icon="check_circle" id="matchIcon">check_circle</span>
<span id="matchText">两次输入的密码一致</span>
</div>
</div>
<!-- 4. Submit CTA Button -->
<div class="pt-2">
<button class="w-full h-11 bg-primary-container text-white font-headline-sm text-[0.9375rem] font-medium rounded-xl hover:bg-[#2563eb] shadow-sm transition-all duration-150 active:scale-[0.99] flex items-center justify-center space-x-2" type="submit">
<span>绑定邮箱并设置密码</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>

<span class="material-symbols-outlined text-[14px] text-outline" data-icon="lock">lock</span>
<span>密码仅用于电脑端登录；小程序始终以微信一键登录</span>
</div>
<div class="flex items-center justify-center space-x-3 text-[11px] text-outline">
<span class="hover:underline cursor-pointer">学术数据安全协议</span>
<span>•</span>
<span class="hover:underline cursor-pointer">个人隐私声明</span>
</div>
</footer>

<!-- Interactive Logic script for micro-interactions -->
<script>
    // Toggle Password Visibility
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerText = 'visibility';
        icon.setAttribute('data-icon', 'visibility');
      } else {
        input.type = 'password';
        icon.innerText = 'visibility_off';
        icon.setAttribute('data-icon', 'visibility_off');
      }
    }

    // Verification Code Countdown
    let countdownTimer = null;
    function triggerCodeCountdown() {
      const btn = document.getElementById('sendCodeBtn');
      const email = document.getElementById('emailInput').value.trim();
      
      if (!email) {
        alert('请先输入有效的邮箱地址');
        document.getElementById('emailInput').focus();
        return;
      }

      let seconds = 60;
      btn.disabled = true;
      btn.classList.add('opacity-60', 'cursor-not-allowed');
      btn.innerText = `${seconds}s 后重发`;

      countdownTimer = setInterval(() => {
        seconds--;
        if (seconds > 0) {
          btn.innerText = `${seconds}s 后重发`;
        } else {
          clearInterval(countdownTimer);
          btn.disabled = false;
          btn.classList.remove('opacity-60', 'cursor-not-allowed');
          btn.innerText = '重新获取';
        }
      }, 1000);
    }

    // Password Validation Feedback
    function validatePasswordStrength() {
      const pwd = document.getElementById('passwordInput').value;
      const badge = document.getElementById('pwdStrengthBadge');
      
      if (!pwd) {
        badge.classList.add('hidden');
        return;
      }
      
      badge.classList.remove('hidden');
      if (pwd.length >= 12 && /[A-Za-z]/.test(pwd) && /[0-9]/.test(pwd)) {
        badge.innerText = '强度：高';
        badge.className = 'font-code-sm font-medium text-[#16a34a]';
      } else if (pwd.length >= 8) {
        badge.innerText = '强度：中';
        badge.className = 'font-code-sm font-medium text-[#d97706]';
      } else {
        badge.innerText = '长度不足 12 位';
        badge.className = 'font-code-sm font-medium text-[#ba1a1a]';
      }
      validatePasswordMatch();
    }

    function validatePasswordMatch() {
      const pwd = document.getElementById('passwordInput').value;
      const confirmPwd = document.getElementById('confirmPasswordInput').value;
      const notice = document.getElementById('matchNotice');
      const text = document.getElementById('matchText');
      const icon = document.getElementById('matchIcon');

      if (!confirmPwd) {
        notice.classList.add('hidden');
        notice.classList.remove('flex');
        return;
      }

      notice.classList.remove('hidden');
      notice.classList.add('flex');

      if (pwd === confirmPwd) {
        notice.className = 'text-[11px] leading-4 flex items-center space-x-1 text-[#16a34a]';
        text.innerText = '两次输入的密码一致';
        icon.innerText = 'check_circle';
        icon.setAttribute('data-icon', 'check_circle');
      } else {
        notice.className = 'text-[11px] leading-4 flex items-center space-x-1 text-[#ba1a1a]';
        text.innerText = '两次输入的密码不一致';
        icon.innerText = 'cancel';
        icon.setAttribute('data-icon', 'cancel');
      }
    }

    function handleFormSubmit() {
      const email = document.getElementById('emailInput').value.trim();
      const pwd = document.getElementById('passwordInput').value;
      const confirmPwd = document.getElementById('confirmPasswordInput').value;

      if (pwd !== confirmPwd) {
        alert('两次输入的密码不一致，请核对。');
        return;
      }
      if (pwd.length < 12) {
        alert('密码长度至少需要 12 位。');
        return;
      }

      alert('邮箱绑定成功！已开通电脑端账号登录权限。');
    }
  </script>
