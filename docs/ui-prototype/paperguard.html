<html lang="zh-CN">

  <style>

    .content{padding:26px 28px 48px;max-width:1540px;margin:0 auto}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.page-head h1{font-size:25px;line-height:1.25;margin:0 0 7px;letter-spacing:-.02em}.page-head p{color:var(--muted);margin:0;line-height:1.65}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:9px 13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;box-shadow:0 1px 1px rgba(0,0,0,.02)}.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.quiet{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}.btn.danger{color:var(--red)}.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

    .list{display:flex;flex-direction:column}.list-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.list-row h3{margin:0 0 5px;font-size:13px}.list-row p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.row-meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:11px}.progress{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}.progress.green i{background:var(--green)}.progress.amber i{background:var(--amber)}

    .table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}.table td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:12px}.table tr:last-child td{border-bottom:0}.table td strong{display:block;font-size:12px}.table td small{color:var(--muted)}
    .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{border:0;background:transparent;padding:10px 13px;color:var(--muted);position:relative}.tab.active{color:var(--brand);font-weight:650}.tab.active:after{content:"";height:2px;background:var(--brand);position:absolute;left:10px;right:10px;bottom:-1px}

    /* writer */

    .context-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}.context-tabs button{border:0;background:transparent;padding:13px 3px;font-size:11px;color:var(--muted);border-bottom:2px solid transparent}.context-tabs button.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:650}.context-body{padding:16px}.ctx-title{font-size:12px;margin:0 0 10px}.spec-list{display:flex;flex-direction:column;gap:8px}.spec{padding:10px;background:var(--surface-2);border-radius:6px}.spec b{font-size:11px;display:block;margin-bottom:4px}.spec span{font-size:10px;color:var(--muted)}.comment{padding:11px 0;border-bottom:1px solid var(--line)}.comment strong{font-size:11px}.comment p{font-size:11px;line-height:1.55;color:var(--muted);margin:5px 0}.ai-box{border:1px solid var(--line);border-radius:8px;overflow:hidden}.ai-head{padding:10px 11px;background:var(--surface-2);font-size:11px;font-weight:650}.ai-copy{padding:11px;font-size:11px;line-height:1.7;color:var(--muted)}.diff-del{background:var(--red-soft);text-decoration:line-through;color:var(--red)}.diff-add{background:var(--green-soft);color:var(--green)}

    '<div class="grid split" style="margin-top:16px"><div class="card"><div class="card-head"><div><h2>当前阶段</h2><p>正文撰写与中期检查</p></div><span class="right">'+pill('进行中','blue')+'</span></div><div class="list"><div class="list-row"><div><h3>完成论文正文初稿</h3><p>必填章节 7 / 9 · 当前正在编辑“3.2 资源调度模型”</p></div><div style="min-width:130px"><div class="progress"><i style="width:72%"></i></div><small>72%</small></div></div><div class="list-row"><div><h3>提交中期检查记录</h3><p>导师已填写评语，等待学生确认</p></div>'+pill('需确认','amber')+'</div><div class="list-row"><div><h3>确认最新写作规范</h3><p>学院规范 V3.2 · 10 月 2 日更新</p></div>'+pill('已完成','green')+'</div></div></div><div class="card card-pad"><h2 style="font-size:15px;margin:0 0 16px">阶段时间线</h2><div class="timeline"><div class="time-item done"><i class="time-dot"></i><b>选题与任务书</b><p>9 月 5 日 已完成</p></div><div class="time-item done"><i class="time-dot"></i><b>开题报告</b><p>9 月 20 日 已通过</p></div><div class="time-item current"><i class="time-dot"></i><b>正文撰写</b><p>截止 10 月 20 日</p></div><div class="time-item"><i class="time-dot"></i><b>初稿评审</b><p>10 月 21 日开始</p></div><div class="time-item"><i class="time-dot"></i><b>终稿归档</b><p>11 月 15 日截止</p></div></div></div></div>';
  }
  function writer(){return '<div class="writer-wrap"><div class="writer-command"><button class="btn quiet" data-action="overview">'+icon('i-grid')+'</button><span class="docname">3.2 资源调度模型</span><span class="save-state">● 已同步</span><div class="stats"><span>8,642 字</span><span>完成 64%</span></div><div class="actions">'+btn('AI 助手','','aiModal','i-spark')+btn('检查','','ctxCheck','i-check')+btn('一键修复','','prototype','i-shield')+btn('导入','','prototype','i-upload')+btn('预览','','prototype','i-file')+btn('导出 DOCX','primary','exportPreview','i-download')+'</div></div><div class="writer-grid"><aside class="outline" id="outline"><div class="outline-head"><span>论文大纲</span><span>结构已锁定</span></div>'+[['封面','done'],['中文摘要','done'],['英文摘要','done'],['1 绪论','done'],['2 相关研究','done'],['3 方法设计','warn'],['3.1 系统模型','done'],['3.2 资源调度模型','active'],['3.3 算法设计',''],['4 实验与分析',''],['5 总结与展望',''],['参考文献','warn'],['致谢','']].map(function(x,i){return '<button class="chapter '+x[1]+' '+(x[1]==='active'?'active':'')+'" data-toast="切换到：'+x[0]+'"><span class="num">'+String(i+1).padStart(2,'0')+'</span><span>'+x[0]+'</span><i class="status"></i></button>'}).join('')+'<div class="outline-foot"><div><span>总字数</span><b>8,642</b></div><div><span>当前章节</span><b>1,286</b></div><div class="progress"><i style="width:64%"></i></div></div></aside><section class="editor-zone"><article class="paper"><div class="paper-kicker"><span>'+pill('正文','brand')+'</span><span>宋体 · 小四 · 1.5 倍行距 · 首行缩进 2 字符</span></div><h1 class="section-title">3.2 资源调度模型</h1>'+paraBlock(1,'在边缘计算环境中，资源分配问题需要同时考虑计算节点的异构性、任务到达的不确定性以及服务时延约束。本文将系统状态表示为由计算资源、网络资源和任务队列共同构成的状态空间，并以长期平均系统开销最小为优化目标。')+paraBlock(2,'具体而言，设边缘节点集合为 E，每个节点具有不同的计算能力与能耗特征。终端任务按照时隙到达，调度器需要在本地执行、边缘卸载与延迟执行之间作出决策。为保证决策可实施，模型同时引入容量约束、队列稳定约束与服务质量约束。')+paraBlock(3,'在此基础上，我们采用李雅普诺夫优化将长期约束转化为逐时隙决策，并设计分层资源调度机制。上层负责跨节点的任务分配，下层根据节点状态完成计算资源编排，从而降低在线求解的复杂度。')+'<button class="insert-line" data-toast="新增段落位置">＋ 添加段落</button></article></section><aside class="context" id="context"><div class   function review(){return head('审阅工作台','基于学生提交快照进行段落批注与审核。',btn('退回修改','danger','returnModal')+btn('通过审核','primary','approveModal','i-check'))+'<div class="review-shell"><aside class="review-list">'+[['3.2 资源调度模型','2 条批注'],['3.3 算法设计','1 条批注'],['4.1 实验设置','未批注'],['4.2 结果分析','未批注']].map(function(x,i){return '<div class="review-item '+(i===0?'active':'')+'"><b>'+x[0]+'</b><p>'+x[1]+'</p></div>'}).join('')+'</aside><article class="review-doc"><span class="pill brand">提交版本 #1 · 只读</span><h2>3.2 资源调度模型</h2><p>在边缘计算环境中，资源分配问题需要同时考虑计算节点的异构性、任务到达的不确定性以及服务时延约束。本文将系统状态表示为由计算资源、网络资源和任务队列共同构成的状态空间。</p><p>具体而言，设边缘节点集合为 E，每个节点具有不同的计算能力与能耗特征。终端任务按照时隙到达，调度器需要在本地执行、边缘卸载与延迟执行之间作出决策。<span class="marked">为保证决策可实施，模型同时引入容量约束、队列稳定约束与服务质量约束。</span></p><p>在此基础上，我们采用李雅普诺夫优化将长期约束转化为逐时隙决策，并设计分层资源调度机制。</p></article><aside class="review-panel"><h2 style="font-size:14px;margin:0">段落批注</h2><div class="quote">为保证决策可实施，模型同时引入容量约束、队列稳定约束与服务质量约束。</div><p style="font-size:11px;color:var(--muted);line-height:1.6">容量约束最好单独列公式，变量表里也要同步。</p>'+pill('待学生修改','amber')+'<h3 style="font-size:12px;margin:22px 0 8px">添加新批注</h3><textarea class="comment-box" placeholder="针对当前选中文字给出明确修改意见"></textarea><div class="actions" style="margin-top:9px">'+btn('添加批注','primary','prototype')+'</div></aside></div>'}

  function modal(title,body,cta){document.getElementById('modalRoot').innerHTML='<div class="modal-backdrop" id="modalBackdrop"><section class="modal"><header><h2>'+title+'</h2><button class="btn quiet" id="modalClose">关闭</button></header><div class="body"><p style="margin:0;color:var(--muted);line-height:1.8">'+body+'</p></div><footer><button class="btn" id="modalCancel">取消</button><button class="btn primary" id="modalNext">'+cta+'</button></footer></section></div>';['modalClose','modalCancel'].forEach(function(id){document.getElementById(id).onclick=closeModal});document.getElementById('modalNext').onclick=function(){toast('已展示流程入口，不会执行真实操作');closeModal()};document.getElementById('modalBackdrop').onclick=function(e){if(e.target.id==='modalBackdrop')closeModal()}}
