<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/icon-shield.png" />
  <link rel="apple-touch-icon" href="/favicon-192.png" />
  <title>PaperGuard — 毕业论文格式合规引擎与工作台</title>
  <!-- 图标与字体走 loli.net CDN 镜像，国内访问更快。
       注意：这里只有 loli.net 一个真实来源，注释原先声称的「备用 Google Fonts 原站」
       并未实现（只有 preconnect，没有 stylesheet），已按实际情况改写。
       CDN 不可用时由 src/shared/iconFont.js 探测并隐藏图标，避免 ligature 名
       被当英文单词显示；详见审查报告 F-16。 -->
  <link rel="preconnect" href="https://fonts.loli.net" />
  <link href="https://fonts.loli.net/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
