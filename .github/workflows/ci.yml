name: CI

# GitHub Actions CI for PaperGuard.
#
# Strategy:
#   - Single OS (ubuntu-latest) — PyQt5 wheels + QT_QPA_PLATFORM=offscreen keeps
#     the GUI tests headless without an X server.
#   - Python matrix (3.10, 3.11) matches pyproject.toml `requires-python = ">=3.10"`.
#   - Two jobs: `test` runs the full pytest suite on both Python versions;
#     `smoke` runs the three end-to-end smoke scripts once (on 3.11) and only
#     after `test` passes.
#   - Submodules are checked out because `references/format-thesis-docx` is a
#     git submodule (docs/scripts reference it even if core code does not import it).

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies for PyQt5 offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libgl1

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -p no:cacheprovider --junitxml=pytest-junit.xml

      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: pytest-junit.xml
          if-no-files-found: warn

  smoke:
    name: End-to-end smoke scripts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies for PyQt5 offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libgl1

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Sprint 5 mutator smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/sprint5_smoke.py

      - name: Synthetic regression samples smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/regression_samples_smoke.py

      - name: PyQt DOCX review session smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/pyqt_docx_session_smoke.py
